<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
    <style>
        body {
            background-image: url('fondo2.gif');
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1, h2 {
            color: darkgreen;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table td {
            padding: 10px;
            text-align: center;
            font-size: 1.1em; /* Tamaño de letra más grande */
        }
        a {
            color: darkgreen;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .content {
            text-align: left;
            margin-top: 20px;
        }
        .last-updated {
            font-size: 0.9em;
            font-style: italic;
            margin-top: 20px;
        }
        input[type="password"], input[type="button"] {
            padding: 5px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Notas</h1>
        <hr>
        <table>
            <tr>
                <td><a href="index.html">Home</a></td>
                <td><a href="cursos.html">Cursos</a></td>
                <td>Notas</td>
                <td><a href="investigacion.html">Investigación</a></td>
                <td><a href="miscelanea.html">Lecturas</a></td>
            </tr>
        </table>
        <hr>

        <div class="content">
            <p>Si quieres saber tu nota, escribe la contraseña y luego haz clic en el botón "Acceder".</p>

            <form>
                <p>
                    <input type="password" name="palclave" size="25" placeholder="Contraseña">
                    <input type="button" value="Acceder" onclick="Saltar(this.form.palclave.value)">
                </p>
                <p>¡Suerte!</p>
            </form>
        </div>

        <div class="ad-container">
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0668090180297806" crossorigin="anonymous"></script>
        </div>

        <footer>
            <p class="last-updated" id="last-updated"></p>
        </footer>
    </div>

    <script>
        // Función para redirigir a un archivo PDF
        function Saltar(pal) {
            if (pal) {
                window.location = pal + ".pdf";
            } else {
                alert("Por favor, introduce una contraseña válida.");
            }
        }

        // Script para fecha de última modificación
        const lastModified = document.getElementById('last-updated');
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        };
        lastModified.textContent = `Última actualización: ${new Date(document.lastModified).toLocaleDateString('es-ES', options)}`;
    </script>
</body>
</html>
